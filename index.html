<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src https://1529785241-cw41hwjsxl.ap-guangzhou.tencentscf.com; base-uri 'none'; form-action 'none'">
  <title>DeepSeek 对话</title>
  <style>
    :root { color-scheme: light; --canvas:#f6f7f9; --surface:#fff; --text:#20242b; --muted:#5e6672; --line:#e2e5ea; --outline:#858f9c; --accent:#245de8; --tint:#edf2ff; --error:#b42318; --radius:8px; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--canvas); color:var(--text); font:16px/1.65 system-ui,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
    button,input,textarea { font:inherit; }
    button { min-height:42px; padding:8px 16px; border:1px solid var(--outline); border-radius:6px; background:var(--surface); color:var(--text); cursor:pointer; line-height:1.4; }
    button:hover { background:#f1f3f5; }
    button:active { background:#e7ebf0; }
    button:disabled { opacity:.5; cursor:default; }
    button.primary { background:var(--accent); border-color:var(--accent); color:white; }
    button.primary:hover:not(:disabled) { background:#194ac0; }
    :focus-visible { outline:3px solid var(--accent); outline-offset:3px; }
    [hidden] { display:none !important; }
    .chat { width:min(880px,calc(100% - 48px)); height:calc(100dvh - 48px); min-height:420px; margin:24px auto; display:flex; flex-direction:column; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; }
    .header { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:16px 24px; border-bottom:1px solid var(--line); }
    h1 { font-size:1.125rem; line-height:1.4; font-weight:650; margin:0; }
    .tools { display:flex; gap:8px; align-items:center; }
    .tools button { font-size:.875rem; min-height:36px; padding:6px 12px; }
    .connection { padding:20px 24px; border-bottom:1px solid var(--line); background:#fafbfc; }
    .connection label { display:block; margin-bottom:8px; font-size:.875rem; font-weight:600; }
    .credentials { display:flex; gap:8px; max-width:480px; }
    input { min-width:0; width:100%; height:44px; padding:9px 12px; border:1px solid var(--outline); border-radius:6px; color:var(--text); background:white; }
    input[aria-invalid="true"] { border-color:var(--error); }
    .credentials button { flex-shrink:0; min-width:80px; }
    .hint { margin:8px 0 0; color:var(--muted); font-size:.8125rem; }
    .error { margin:8px 0 0; color:var(--error); font-size:.875rem; overflow-wrap:anywhere; }
    .conversation { position:relative; flex:1; min-height:0; overflow:auto; overscroll-behavior:contain; padding:24px; scroll-padding-block:24px; }
    .empty { min-height:100%; display:grid; place-items:center; margin:0; color:var(--muted); font-size:.9375rem; text-align:center; }
    .message { margin:0 0 24px; max-width:100%; }
    .message:last-child { margin-bottom:0; }
    .message-label { margin:0 0 6px; color:var(--muted); font-size:.8125rem; font-weight:600; }
    .message-content { white-space:pre-wrap; overflow-wrap:anywhere; margin:0; }
    .message.user { max-width:85%; margin-left:auto; padding:12px 16px; border-radius:var(--radius); background:var(--tint); }
    .message.user .message-label { color:#405987; }
    .message.thinking .message-content { color:var(--muted); }
    .composer { padding:16px 24px 20px; border-top:1px solid var(--line); }
    .composer label { display:block; font-size:.875rem; font-weight:600; margin-bottom:8px; }
    .compose-row { display:flex; align-items:flex-end; gap:12px; }
    textarea { display:block; width:100%; min-height:84px; max-height:200px; resize:vertical; padding:10px 12px; line-height:1.6; border:1px solid var(--outline); border-radius:6px; background:var(--surface); color:var(--text); }
    textarea:disabled { background:#f6f7f9; }
    .send { min-width:80px; min-height:44px; }
    .composer-note { display:flex; justify-content:space-between; flex-wrap:wrap; gap:4px 16px; margin-top:8px; font-size:.75rem; color:var(--muted); }
    @media(max-width:600px) {
      .chat { width:100%; height:100dvh; min-height:360px; margin:0; border:0; border-radius:0; }
      .header { padding:16px; gap:8px; }
      .tools { gap:4px; }
      .tools button { min-height:44px; padding:8px 10px; }
      .connection { padding:16px; }
      .conversation { padding:20px 16px; }
      .message.user { max-width:92%; }
      .composer { padding:12px 16px max(16px,env(safe-area-inset-bottom)); }
      .compose-row { gap:8px; }
      .send { min-width:64px; padding-inline:10px; }
      .keyboard-hint { display:none; }
    }
  </style>
</head>
<body>
  <main class="chat" aria-label="DeepSeek 聊天窗口">
    <header class="header">
      <h1>DeepSeek 对话</h1>
      <div class="tools">
        <button id="new-chat" type="button" disabled>新对话</button>
        <button id="lock" type="button" hidden>锁定</button>
      </div>
    </header>
    <form id="connection" class="connection">
      <label for="access-code">演示口令</label>
      <div class="credentials">
        <input id="access-code" type="password" minlength="12" maxlength="256" required autocomplete="off" autocapitalize="off" spellcheck="false" aria-describedby="code-hint code-error" placeholder="输入演示口令">
        <button id="connect" class="primary" type="submit">连接</button>
      </div>
      <p id="code-hint" class="hint">口令由页面所有者提供。</p>
      <p id="code-error" class="error" role="alert" hidden></p>
    </form>
    <section id="conversation" class="conversation" aria-label="对话记录" role="log" aria-live="polite" aria-relevant="additions text">
      <p id="empty" class="empty">对话将在这里显示</p>
    </section>
    <form id="composer" class="composer">
      <label for="prompt">消息</label>
      <div class="compose-row">
        <textarea id="prompt" rows="2" maxlength="6000" disabled placeholder="输入你的问题" aria-describedby="chat-error"></textarea>
        <button id="send" class="primary send" type="submit" disabled>发送</button>
      </div>
      <p id="chat-error" class="error" role="alert" hidden></p>
      <div class="composer-note">
        <span>AI 回答可能有误，请核实重要信息。</span>
        <span class="keyboard-hint">Enter 发送 · Shift + Enter 换行</span>
      </div>
    </form>
  </main>
  <script>
    'use strict';
    (() => {
      const API_URL = 'https://1529785241-cw41hwjsxl.ap-guangzhou.tencentscf.com/chat';
      const $ = id => document.getElementById(id);
      const connection = $('connection'), codeInput = $('access-code'), connect = $('connect');
      const codeError = $('code-error'), chatError = $('chat-error'), composer = $('composer');
      const conversation = $('conversation'), empty = $('empty'), prompt = $('prompt');
      const send = $('send'), newChat = $('new-chat'), lock = $('lock');
      let accessCode = '', history = [], pending = null;

      function showError(element, message = '') {
        element.textContent = message;
        element.hidden = !message;
      }
      function updateControls() {
        prompt.disabled = !accessCode;
        send.disabled = !accessCode || (!pending && !prompt.value.trim());
        send.textContent = pending ? '停止' : '发送';
        send.setAttribute('aria-label', pending ? '停止等待回答' : '发送消息');
        newChat.disabled = Boolean(pending) || !history.length;
        lock.disabled = Boolean(pending);
      }
      function resetChat() {
        history = [];
        conversation.replaceChildren(empty);
        empty.hidden = false;
        prompt.value = '';
        showError(chatError);
        updateControls();
      }
      function message(role, text, thinking = false) {
        const article = document.createElement('article');
        article.className = 'message ' + role + (thinking ? ' thinking' : '');
        const label = document.createElement('p');
        label.className = 'message-label';
        label.textContent = role === 'user' ? '你' : 'DeepSeek';
        const content = document.createElement('p');
        content.className = 'message-content';
        content.textContent = text;
        article.append(label, content);
        empty.hidden = true;
        conversation.append(article);
        conversation.scrollTop = conversation.scrollHeight;
        return { article, content };
      }
      async function request(body, code, signal) {
        const response = await fetch(API_URL, {
          method: 'POST', signal,
          headers: { 'Content-Type': 'application/json', 'X-Demo-Code': code },
          body: JSON.stringify(body)
        });
        let data;
        try { data = await response.json(); }
        catch { throw new Error('接口返回异常，请稍后重试。'); }
        return { response, data };
      }
      connection.addEventListener('submit', async event => {
        event.preventDefault();
        if (connect.disabled) return;
        const code = codeInput.value.trim();
        if (code.length < 12) { showError(codeError, '口令至少需要 12 位。'); return; }
        showError(codeError);
        codeInput.removeAttribute('aria-invalid');
        connect.disabled = true;
        codeInput.disabled = true;
        connect.textContent = '连接中';
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 20000);
        try {
          // Authentication runs before message validation; this checks the code without a model call.
          const { response, data } = await request({ messages: [] }, code, controller.signal);
          if (response.status !== 400 || !String(data.error).startsWith('messages 需包含')) {
            throw new Error(data.error || '连接未成功，请稍后重试。');
          }
          accessCode = code;
          codeInput.value = '';
          connection.hidden = true;
          lock.hidden = false;
          updateControls();
          prompt.focus();
        } catch (error) {
          showError(codeError, controller.signal.aborted ? '连接超时，请重试。' :
            error instanceof TypeError ? '连接失败，请检查网络后重试。' : error.message);
          codeInput.setAttribute('aria-invalid', 'true');
        } finally {
          clearTimeout(timer);
          connect.disabled = false;
          codeInput.disabled = false;
          connect.textContent = '连接';
          if (!connection.hidden) codeInput.focus();
        }
      });
      prompt.addEventListener('input', updateControls);
      codeInput.addEventListener('input', () => {
        showError(codeError);
        codeInput.removeAttribute('aria-invalid');
      });
      prompt.addEventListener('keydown', event => {
        if (event.key === 'Enter' && !event.shiftKey && !event.isComposing && !pending) {
          event.preventDefault();
          composer.requestSubmit();
        }
      });
      composer.addEventListener('submit', async event => {
        event.preventDefault();
        if (pending) { pending.abort(); return; }
        const text = prompt.value.trim();
        if (!accessCode || !text) return;
        showError(chatError);
        const context = history.slice();
        while (context.length && (context.length >= 39 || context.reduce((sum, item) => sum + item.content.length, text.length) > 24000)) context.splice(0, 2);
        context.push({ role: 'user', content: text });
        const userMessage = message('user', text);
        const assistantMessage = message('assistant', '正在思考…', true);
        prompt.value = '';
        const controller = new AbortController();
        pending = controller;
        let timedOut = false;
        const timer = setTimeout(() => { timedOut = true; controller.abort(); }, 110000);
        updateControls();
        try {
          const { response, data } = await request({ messages: context, stream: false, max_tokens: 1024 }, accessCode, controller.signal);
          if (!response.ok) throw Object.assign(new Error(data.error || '发送失败，请稍后重试。'), { status: response.status });
          if (typeof data.reply !== 'string') throw new Error('回答格式异常，请重新发送。');
          history = context.concat({ role: 'assistant', content: data.reply });
          assistantMessage.content.textContent = data.reply;
          assistantMessage.article.classList.remove('thinking');
          conversation.scrollTop = conversation.scrollHeight;
        } catch (error) {
          userMessage.article.remove();
          assistantMessage.article.remove();
          if (!prompt.value) prompt.value = text;
          if (!history.length) empty.hidden = false;
          showError(chatError, controller.signal.aborted ? (timedOut ? '等待回答超时，可以重新发送。' : '已停止等待。') :
            error instanceof TypeError ? '发送失败，请检查网络后重试。' : error.message);
          if (error.status === 401) {
            accessCode = '';
            connection.hidden = false;
            lock.hidden = true;
            showError(codeError, '口令已失效，请重新连接。');
          }
        } finally {
          clearTimeout(timer);
          pending = null;
          updateControls();
          (accessCode ? prompt : codeInput).focus();
        }
      });
      newChat.addEventListener('click', () => { resetChat(); prompt.focus(); });
      lock.addEventListener('click', () => {
        accessCode = '';
        resetChat();
        connection.hidden = false;
        lock.hidden = true;
        showError(codeError);
        codeInput.focus();
      });
      updateControls();
    })();
  </script>
</body>
</html>
