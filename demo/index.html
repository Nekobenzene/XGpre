<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' https://1529785241-cw41hwjsxl.ap-guangzhou.tencentscf.com; base-uri 'none'; form-action 'none'">
  <title>国际援助案例与问答</title>
  <style>
    :root { color-scheme: light; --canvas:#f6f7f9; --surface:#fff; --text:#20242b; --muted:#5e6672; --line:#e2e5ea; --outline:#858f9c; --accent:#245de8; --tint:#edf2ff; --error:#b42318; --radius:8px; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--canvas); color:var(--text); font:16px/1.65 system-ui,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
    button,input,textarea { font:inherit; }
    button { min-height:42px; padding:8px 16px; border:1px solid var(--outline); border-radius:6px; background:var(--surface); color:var(--text); cursor:pointer; line-height:1.4; }
    button:hover { background:#f1f3f5; }
    button:active { background:#e7ebf0; }
    button:disabled { opacity:.5; cursor:default; }
    button.primary { background:var(--accent); border-color:var(--accent); color:white; }
    button.primary:hover:not(:disabled) { background:#194ac0; }
    :focus-visible { outline:3px solid var(--accent); outline-offset:3px; }
    [hidden] { display:none !important; }
    .chat { width:min(880px,calc(100% - 48px)); height:calc(100dvh - 48px); min-height:420px; margin:24px auto; display:flex; flex-direction:column; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; }
    .header { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:16px 24px; border-bottom:1px solid var(--line); }
    h1 { font-size:1.125rem; line-height:1.4; font-weight:650; margin:0; }
    .tools { display:flex; gap:8px; align-items:center; }
    .tools button { font-size:.875rem; min-height:36px; padding:6px 12px; }
    .connection { padding:20px 24px; border-bottom:1px solid var(--line); background:#fafbfc; }
    .connection label { display:block; margin-bottom:8px; font-size:.875rem; font-weight:600; }
    .credentials { display:flex; gap:8px; max-width:480px; }
    input { min-width:0; width:100%; height:44px; padding:9px 12px; border:1px solid var(--outline); border-radius:6px; color:var(--text); background:white; }
    input[aria-invalid="true"] { border-color:var(--error); }
    .credentials button { flex-shrink:0; min-width:80px; }
    .hint { margin:8px 0 0; color:var(--muted); font-size:.8125rem; }
    .error { margin:8px 0 0; color:var(--error); font-size:.875rem; overflow-wrap:anywhere; }
    .conversation { position:relative; flex:1; min-height:0; overflow:auto; overscroll-behavior:contain; padding:24px; scroll-padding-block:24px; }
    .modes { display:flex; gap:8px; padding:10px 16px; border-bottom:1px solid var(--line); }
    .modes button[aria-pressed="true"] { background:var(--tint); color:#244797; border-color:var(--accent); }
    .panel { flex:1; min-height:0; display:flex; flex-direction:column; }
    .case-copy { max-width:64ch; overflow-wrap:anywhere; }
    .case-copy h2 { font-size:1.25rem; margin:0 0 12px; }
    .case-copy h3 { font-size:1rem; margin:20px 0 6px; }
    .case-copy p { margin:0 0 12px; }
    .case-copy figure { margin:16px 0; }
    .case-copy img { display:block; max-width:100%; height:auto; }
    .case-copy figcaption { font-size:.8125rem; color:var(--muted); margin-top:6px; }
    .cases { display:flex; align-items:center; flex-wrap:wrap; gap:8px; padding:10px 16px; border-bottom:1px solid var(--line); font-size:.875rem; }
    .cases select { font:inherit; color:var(--text); background:var(--surface); border:1px solid var(--outline); border-radius:6px; min-height:42px; max-width:100%; min-width:0; flex:1 1 180px; padding:6px 8px; }
    .cases p { flex-basis:100%; margin:0; }
    .empty { min-height:100%; display:grid; place-items:center; margin:0; color:var(--muted); font-size:.9375rem; text-align:center; }
    .message { margin:0 0 24px; max-width:100%; }
    .message:last-child { margin-bottom:0; }
    .message-label { margin:0 0 6px; color:var(--muted); font-size:.8125rem; font-weight:600; }
    .message-content { white-space:pre-wrap; overflow-wrap:anywhere; margin:0; }
    .message.user { max-width:85%; margin-left:auto; padding:12px 16px; border-radius:var(--radius); background:var(--tint); }
    .message.user .message-label { color:#405987; }
    .message.thinking .message-content { color:var(--muted); }
    .markdown { white-space:normal; }
    .markdown > :first-child { margin-top:0; }
    .markdown > :last-child { margin-bottom:0; }
    .markdown h1, .markdown h2, .markdown h3, .markdown h4, .markdown h5, .markdown h6 { font-size:1rem; margin:16px 0 6px; }
    .markdown p, .markdown ul, .markdown ol, .markdown table, .markdown pre { margin:8px 0 12px; }
    .markdown blockquote { margin:8px 0; padding:0 12px; border-left:3px solid var(--line); color:var(--muted); }
    .markdown code { background:var(--canvas); padding:2px 4px; border-radius:4px; }
    .markdown pre { overflow:auto; background:var(--canvas); padding:12px; border-radius:6px; }
    .markdown pre code { padding:0; }
    .markdown table { display:block; max-width:100%; overflow:auto; border-collapse:collapse; }
    .markdown th, .markdown td { border:1px solid var(--line); padding:4px 8px; text-align:left; }
    .composer { padding:16px 24px 20px; border-top:1px solid var(--line); }
    .composer label { display:block; font-size:.875rem; font-weight:600; margin-bottom:8px; }
    .web-keywords { margin-bottom:10px; }
    .compose-row { display:flex; align-items:flex-end; gap:12px; }
    textarea { display:block; width:100%; min-height:84px; max-height:200px; resize:vertical; padding:10px 12px; line-height:1.6; border:1px solid var(--outline); border-radius:6px; background:var(--surface); color:var(--text); }
    textarea:disabled { background:#f6f7f9; }
    .send { min-width:80px; min-height:44px; }
    .composer-note { display:flex; justify-content:space-between; flex-wrap:wrap; gap:4px 16px; margin-top:8px; font-size:.75rem; color:var(--muted); }
    @media(max-width:600px) {
      .chat { width:100%; height:100dvh; min-height:360px; margin:0; border:0; border-radius:0; }
      .header { padding:16px; gap:8px; }
      .tools { gap:4px; }
      .tools button { min-height:44px; padding:8px 10px; }
      .connection { padding:16px; }
      .conversation { padding:20px 16px; }
      .message.user { max-width:92%; }
      .composer { padding:12px 16px max(16px,env(safe-area-inset-bottom)); }
      .compose-row { gap:8px; }
      .send { min-width:64px; padding-inline:10px; }
      .keyboard-hint { display:none; }
    }
  </style>
</head>
<body>
  <main class="chat" aria-label="国际援助案例与问答">
    <header class="header">
      <h1>国际援助案例与问答</h1>
      <div id="chat-tools" class="tools" hidden>
        <button id="new-chat" type="button" disabled>新对话</button>
        <button id="lock" type="button" hidden>锁定</button>
      </div>
    </header>
    <div class="modes" role="group" aria-label="阅读或提问">
      <button id="show-cases" type="button" aria-pressed="true" aria-controls="case-panel">内置案例</button>
      <button id="show-chat" type="button" aria-pressed="false" aria-controls="chat-panel">AI 问答</button>
    </div>
    <section id="case-panel" class="panel" aria-label="内置案例">
      <div class="cases">
        <label for="case-select">案例</label>
        <select id="case-select" disabled>
          <option value="">选择一个案例</option>
        </select>
        <p id="case-error" class="error" role="alert" hidden></p>
      </div>
      <div id="case-scroll" class="conversation">
        <p id="case-status" class="hint" role="status">正在加载案例目录…</p>
        <article id="case-copy" class="case-copy" hidden></article>
      </div>
    </section>
    <section id="chat-panel" class="panel" aria-label="AI 事件问答" hidden>
    <form id="connection" class="connection">
      <label for="access-code">演示口令</label>
      <div class="credentials">
        <input id="access-code" type="password" minlength="12" maxlength="256" required autocomplete="off" autocapitalize="off" spellcheck="false" aria-describedby="code-hint code-error" placeholder="输入演示口令">
        <button id="connect" class="primary" type="submit">连接</button>
      </div>
      <p id="code-hint" class="hint">口令由页面所有者提供。</p>
      <p id="code-error" class="error" role="alert" hidden></p>
    </form>
    <section id="conversation" class="conversation" aria-label="对话记录" role="log" aria-live="polite" aria-relevant="additions text">
      <p id="empty" class="empty">输入事件名称、时间或地点，向 AI 提问。</p>
    </section>
    <form id="composer" class="composer">
      <div class="web-keywords" id="web-keywords-row" hidden>
        <label for="web-keywords">公开检索关键词（可选，发送至 Google 新闻）</label>
        <input id="web-keywords" maxlength="100" placeholder="如：2023 土耳其地震 中国救援队">
      </div>
      <label for="prompt">事件或追问</label>
      <div class="compose-row">
        <textarea id="prompt" rows="2" maxlength="6000" disabled placeholder="例如：中国参与了哪些2023年土耳其地震救援行动？" aria-describedby="chat-error"></textarea>
        <button id="send" class="primary send" type="submit" disabled>发送</button>
      </div>
      <p id="chat-error" class="error" role="alert" hidden></p>
      <div class="composer-note">
        <span id="search-note">AI 回答可能有误，请核实重要信息。</span>
        <span class="keyboard-hint">Enter 发送 · Shift + Enter 换行</span>
      </div>
    </form>
    </section>
  </main>
  <script src="./vendor/markdown-it.min.js"></script>
  <script>
    'use strict';
    (() => {
      const isLocalPreview = ['localhost', '127.0.0.1'].includes(location.hostname);
      const API_URL = isLocalPreview
        ? '/chat'
        : 'https://1529785241-cw41hwjsxl.ap-guangzhou.tencentscf.com/chat';
      const $ = id => document.getElementById(id);
      const connection = $('connection'), codeInput = $('access-code'), connect = $('connect');
      const codeError = $('code-error'), chatError = $('chat-error'), composer = $('composer');
      const conversation = $('conversation'), empty = $('empty'), prompt = $('prompt');
      const send = $('send'), newChat = $('new-chat'), lock = $('lock');
      const webKeywords = $('web-keywords');
      const webKeywordsRow = $('web-keywords-row');
      const showCases = $('show-cases'), showChat = $('show-chat');
      const casePanel = $('case-panel'), chatPanel = $('chat-panel'), chatTools = $('chat-tools');
      const caseSelect = $('case-select'), caseError = $('case-error'), caseCopy = $('case-copy');
      const caseScroll = $('case-scroll'), caseStatus = $('case-status');
      const cases = new Map();
      const encoder = new TextEncoder();
      const markdown = typeof window.markdownit === 'function'
        ? window.markdownit({ html: false, breaks: true }).disable('image')
        : null;
      if (markdown) {
        markdown.validateLink = url => /^https?:\/\//i.test(url);
        markdown.renderer.rules.link_open = (tokens, index, options, _env, renderer) => {
          tokens[index].attrSet('target', '_blank');
          tokens[index].attrSet('rel', 'noopener noreferrer');
          return renderer.renderToken(tokens, index, options);
        };
      }
      const eventInstructions = [
        '你是习概课汇报的资料助手，主题为新时代的中国外交，聚焦中国参与的国际援助与人道合作。用中文回答用户指定的事件和追问。',
        '收到问题直接处理，先看本轮检索线索和对话上下文。最符合的是一个事件，就直接讲；用户明确要列举、多举例或比较时，直接给出多个相关事件。仅当用户明显在指某一个事件，且检索后仍有两个或更多同样吻合的候选、选错会改变答案时，列出两三个候选，问一句是哪件事。其余情况按最合理的理解回答，必要时一句话交代采用的理解。',
        '事件明确且信息足够时，用“事件概况”“援助行动与结果”“理念解读”三个短段落组织首次讲解，约300至450字。具体追问直接回答，并采用当前对话中已经确认的事件信息。',
        '交代时间、地点、当事方、需求、行动和已知结果。区分政府、民间组织、企业与国际机构的角色。仅在有依据时判定项目属于无偿援助、技术合作、人道救援、贷款或其他合作形式。',
        '将事实、当事方表态和分析分开。理念解读选择一到两个与行动直接相关的观点，逐一说明事实依据。把承诺、计划、实际交付和公开报道的结果分别表述。单一案例不足以支持的成效或因果结论留作待核实。',
        '用明确、自然的语气，把答案放在前面。只指出影响结论的关键不确定性，避免反复提示、质疑或要求用户补资料。检索线索和用户给出的资料可以据实引用；仅凭新闻标题不能确认报道正文的细节。没有检索线索时，按有把握的知识直接答，不编造故事、引语、链接、出处或数据，也不冒称查证过。'
      ].join('\n');
      let accessCode = '', history = [], pending = null;
      let caseLoad = null;

      function showError(element, message = '') {
        element.textContent = message;
        element.hidden = !message;
      }
      function updateControls() {
        prompt.disabled = !accessCode;
        webKeywords.disabled = !accessCode;
        send.disabled = !accessCode || (!pending && !prompt.value.trim());
        send.textContent = pending ? '停止' : '发送';
        send.setAttribute('aria-label', pending ? '停止等待回答' : '发送消息');
        newChat.disabled = Boolean(pending) || !history.length;
        lock.disabled = Boolean(pending);
      }
      function resetChat() {
        history = [];
        conversation.replaceChildren(empty);
        empty.hidden = false;
        prompt.value = '';
        webKeywords.value = '';
        showError(chatError);
        updateControls();
      }
      function message(role, text, thinking = false) {
        const article = document.createElement('article');
        article.className = 'message ' + role + (thinking ? ' thinking' : '');
        const label = document.createElement('p');
        label.className = 'message-label';
        label.textContent = role === 'user' ? '你' : 'DeepSeek';
        const content = document.createElement(role === 'assistant' ? 'div' : 'p');
        content.className = 'message-content';
        content.textContent = text;
        article.append(label, content);
        empty.hidden = true;
        conversation.append(article);
        conversation.scrollTop = conversation.scrollHeight;
        return { article, content };
      }
      async function request(body, code, signal) {
        const response = await fetch(API_URL, {
          method: 'POST', signal,
          headers: { 'Content-Type': 'application/json', 'X-Demo-Code': code },
          body: JSON.stringify(body)
        });
        let data;
        try { data = await response.json(); }
        catch { throw new Error('接口返回异常，请稍后重试。'); }
        return { response, data };
      }
      async function readCaseJson(file, signal) {
        const response = await fetch('../examples/' + file, { signal });
        if (!response.ok) throw new Error('案例材料加载失败，请稍后重试。');
        return response.json();
      }
      async function loadCases() {
        try {
          const index = await readCaseJson('index.json', AbortSignal.timeout(15000));
          for (const entry of index.cases) {
            cases.set(entry.id, entry);
            const label = entry.navigation
              ? entry.navigation.title + '｜' + entry.navigation.subtitle
              : entry.title;
            caseSelect.add(new Option(label, entry.id));
          }
          caseSelect.disabled = !cases.size;
          caseStatus.textContent = cases.size ? '请选择一个案例。' : '暂无内置案例。';
        } catch {
          caseStatus.textContent = '';
          showError(caseError, '案例目录加载失败，请刷新页面重试。');
        }
      }
      function appendText(parent, tag, text) {
        const element = document.createElement(tag);
        element.textContent = text;
        parent.append(element);
        return element;
      }
      function renderCase(data, media) {
        caseCopy.replaceChildren();
        appendText(caseCopy, 'h2', data.title);
        if (data.navigation?.subtitle) appendText(caseCopy, 'p', data.navigation.subtitle);
        appendText(caseCopy, 'h3', '小故事');
        appendText(caseCopy, 'p', data.story.text);
        appendText(caseCopy, 'h3', '事件经过');
        appendText(caseCopy, 'p', data.presentation.event);
        appendText(caseCopy, 'h3', '理念解读');
        appendText(caseCopy, 'p', data.presentation.analysis);
        appendText(caseCopy, 'h3', '资料来源');
        const sources = document.createElement('ul');
        for (const source of data.sources) {
          const item = document.createElement('li');
          const link = appendText(item, 'a', source.title);
          if (/^https?:\/\//i.test(source.url)) {
            link.href = source.url;
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
          }
          appendText(item, 'span', ' · ' + source.publisher + ' · ' + source.date);
          sources.append(item);
        }
        caseCopy.append(sources);
        for (const reference of media?.references || []) {
          if (!/^https?:\/\//i.test(reference.source_url)) continue;
          const photo = appendText(caseCopy, 'p', '');
          const link = appendText(photo, 'a', reference.label);
          link.href = reference.source_url;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
        }
        for (const image of media?.images || []) {
          if (!/^[a-z0-9-]+\.(?:jpg|png|webp)$/.test(image.file)) continue;
          const figure = document.createElement('figure');
          const picture = document.createElement('img');
          picture.src = '../examples/' + data.id + '/' + image.file;
          picture.alt = image.caption;
          picture.loading = 'lazy';
          figure.append(picture);
          const caption = appendText(figure, 'figcaption',
            [image.caption, image.creator, image.license].filter(Boolean).join(' · '));
          if (/^https?:\/\//i.test(image.source_url)) {
            const link = appendText(caption, 'a', ' 查看原图与许可');
            link.href = image.source_url;
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
          }
          caseCopy.append(figure);
        }
        caseCopy.hidden = false;
        caseScroll.scrollTop = 0;
      }
      async function selectCase() {
        caseLoad?.abort();
        caseLoad = null;
        caseCopy.hidden = true;
        showError(caseError);
        const entry = cases.get(caseSelect.value);
        caseStatus.textContent = entry ? '正在加载案例…' : '请选择一个案例。';
        if (!entry) return;
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 15000);
        caseLoad = controller;
        try {
          const [data, media] = await Promise.all([
            readCaseJson(entry.file, controller.signal),
            entry.media ? readCaseJson(entry.media, controller.signal).catch(() => null) : null
          ]);
          if (caseLoad === controller) renderCase(data, media);
        } catch {
          if (caseLoad === controller) showError(caseError, '案例加载失败，请重新选择。');
        } finally {
          clearTimeout(timer);
          if (caseLoad === controller) {
            caseStatus.textContent = '';
            caseLoad = null;
          }
        }
      }
      function switchMode(chatMode) {
        casePanel.hidden = chatMode;
        chatPanel.hidden = !chatMode;
        chatTools.hidden = !chatMode;
        showCases.setAttribute('aria-pressed', String(!chatMode));
        showChat.setAttribute('aria-pressed', String(chatMode));
      }
      showCases.addEventListener('click', () => switchMode(false));
      showChat.addEventListener('click', () => switchMode(true));
      caseSelect.addEventListener('change', selectCase);
      connection.addEventListener('submit', async event => {
        event.preventDefault();
        if (connect.disabled) return;
        const code = codeInput.value.trim();
        if (code.length < 12) { showError(codeError, '口令至少需要 12 位。'); return; }
        showError(codeError);
        codeInput.removeAttribute('aria-invalid');
        connect.disabled = true;
        codeInput.disabled = true;
        connect.textContent = '连接中';
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 20000);
        try {
          // Authentication runs before message validation; this checks the code without a model call.
          const { response, data } = await request({ messages: [] }, code, controller.signal);
          if (response.status !== 400 || !String(data.error).startsWith('messages 需包含')) {
            throw new Error(data.error || '连接未成功，请稍后重试。');
          }
          accessCode = code;
          codeInput.value = '';
          connection.hidden = true;
          lock.hidden = false;
          updateControls();
          if (!chatPanel.hidden) prompt.focus();
        } catch (error) {
          showError(codeError, controller.signal.aborted ? '连接超时，请重试。' :
            error instanceof TypeError ? '连接失败，请检查网络后重试。' : error.message);
          codeInput.setAttribute('aria-invalid', 'true');
        } finally {
          clearTimeout(timer);
          connect.disabled = false;
          codeInput.disabled = false;
          connect.textContent = '连接';
          if (!chatPanel.hidden && !connection.hidden) codeInput.focus();
        }
      });
      prompt.addEventListener('input', updateControls);
      codeInput.addEventListener('input', () => {
        showError(codeError);
        codeInput.removeAttribute('aria-invalid');
      });
      prompt.addEventListener('keydown', event => {
        if (event.key === 'Enter' && !event.shiftKey && !event.isComposing && !pending) {
          event.preventDefault();
          composer.requestSubmit();
        }
      });
      composer.addEventListener('submit', event => {
        event.preventDefault();
        if (pending) { pending.abort(); return; }
        const text = prompt.value.trim();
        if (text) sendMessage(text);
      });
      async function sendMessage(text) {
        if (!accessCode || pending) return;
        showError(chatError);
        let userMessage, assistantMessage;
        const keywords = webKeywordsRow.hidden ? '' : webKeywords.value.trim();
        prompt.value = '';
        webKeywords.value = '';
        const controller = new AbortController();
        pending = controller;
        let timedOut = false;
        const timer = setTimeout(() => { timedOut = true; controller.abort(); }, 110000);
        updateControls();
        try {
          const context = history.slice();
          const instructions = { role: 'system', content: eventInstructions };
          const body = { messages: [], stream: false, max_tokens: 1024 };
          if (keywords) body.search_keywords = keywords;
          const current = { role: 'user', content: text };
          for (;;) {
            body.messages = [instructions, ...context, current];
            const chars = body.messages.reduce((sum, item) => sum + item.content.length, 0);
            if (body.messages.length <= 40 && chars <= 24000 && encoder.encode(JSON.stringify(body)).length <= 65536) break;
            if (!context.length) throw new Error('本次消息过长，请缩短后再试。');
            context.splice(0, 2);
          }
          userMessage = message('user', text);
          assistantMessage = message('assistant', '正在思考…', true);
          const { response, data } = await request(body, accessCode, controller.signal);
          if (!response.ok) throw Object.assign(new Error(data.error || '发送失败，请稍后重试。'), { status: response.status });
          if (typeof data.reply !== 'string') throw new Error('回答格式异常，请重新发送。');
          history = [...context, current, { role: 'assistant', content: data.reply }];
          if (markdown) {
            assistantMessage.content.classList.add('markdown');
            // markdown-it escapes raw HTML and the link policy only permits HTTP(S).
            assistantMessage.content.innerHTML = markdown.render(data.reply);
          } else {
            assistantMessage.content.textContent = data.reply;
          }
          if (Array.isArray(data.search_sources) && data.search_sources.length) {
            const details = document.createElement('details');
            appendText(details, 'summary', '本次检索线索');
            const list = document.createElement('ol');
            for (const source of data.search_sources) {
              const item = document.createElement('li');
              const link = appendText(item, 'a', source.title);
              if (/^https?:\/\//i.test(source.url)) {
                link.href = source.url;
                link.target = '_blank';
                link.rel = 'noopener noreferrer';
              }
              list.append(item);
            }
            details.append(list);
            assistantMessage.article.append(details);
          }
          assistantMessage.article.classList.remove('thinking');
          conversation.scrollTop = conversation.scrollHeight;
        } catch (error) {
          userMessage?.article.remove();
          assistantMessage?.article.remove();
          if (!prompt.value) prompt.value = text;
          if (!webKeywords.value) webKeywords.value = keywords;
          if (!history.length) empty.hidden = false;
          showError(chatError, controller.signal.aborted ? (timedOut ? '等待回答超时，可以重新发送。' : '已停止等待。') :
            error instanceof TypeError ? '发送失败，请检查网络后重试。' : error.message);
          if (error.status === 401) {
            accessCode = '';
            connection.hidden = false;
            lock.hidden = true;
            showError(codeError, '口令已失效，请重新连接。');
          }
        } finally {
          clearTimeout(timer);
          pending = null;
          updateControls();
          if (!chatPanel.hidden) (accessCode ? prompt : codeInput).focus();
        }
      }
      newChat.addEventListener('click', () => { resetChat(); prompt.focus(); });
      lock.addEventListener('click', () => {
        accessCode = '';
        resetChat();
        connection.hidden = false;
        lock.hidden = true;
        showError(codeError);
        codeInput.focus();
      });
      updateControls();
      loadCases();
    })();
  </script>
</body>
</html>
